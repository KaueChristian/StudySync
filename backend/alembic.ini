# ============================================================================
# Alembic — configuração de migrations do StudySync
#
# A URL do banco NÃO é definida aqui: o `alembic/env.py` a lê de
# `app.core.config.settings`, mantendo uma única fonte de verdade (.env).
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Nome dos arquivos de migration: 0001_descricao.py, 0002_..., etc.
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

[post_write_hooks]

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
